name: flame_worldgen
description: Infinite, seeded, procedural tile worlds for Flame, with chunk streaming, noise-driven biomes, autotiling, object scattering, collision and saveable edits.
version: 3.0.0-dev.1
repository: https://github.com/bszarlej/flame_worldgen
issue_tracker: https://github.com/bszarlej/flame_worldgen/issues
topics:
  - flame
  - game-development
  - procedural-generation
  - tilemap
  - noise

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
  flame_test: ^2.3.1
  test: ^1.31.1
