name: CI

on:
  push:
    branches:
      # `*` doesn't match `/`, so it would skip branches like release/3.0.0.
      - '**'
    tags-ignore:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_call:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter pub publish --dry-run

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test

  # The pure-Dart core compiled with dart2js, where ints are JS doubles and
  # bitwise operators return unsigned 32-bit results. Catches determinism bugs
  # the VM can't.
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart test -p chrome test/core

  # Checks that the lower bounds in pubspec.yaml still work.
  downgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub downgrade
      - run: flutter analyze lib
